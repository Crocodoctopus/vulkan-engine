[package]
name = "vulkan-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
winit = { version = "0.30.0", default-features = false, features = ["rwh_06", "x11", "wayland"] }
vk-mem = "0.4.0"
glam = "0.28"
tobj = "0.1.7"
png = "0.17.13"
itertools = "0.13.0"
meshopt = "0.4.1"
crossbeam = "0.8.4"
threadpool = "1.8.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.test]
panic = "abort"
